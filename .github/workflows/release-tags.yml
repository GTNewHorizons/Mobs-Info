
name: Release tagged build

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ github.ref_name }}
      UPSTREAM_REPOSITORY: kuba6000/Mobs-Info
      SNAPSHOT: ${{ endsWith(github.ref_name, '-snapshot') || contains(github.event.head_commit.message, '[snapshot]') }}
      PRERELEASE: ${{ endsWith(github.ref_name, '-pre') }}
      MAVEN_PUBLISHING_URL: ${{ vars.MAVEN_PUBLISHING_URL || 'https://nexus.gtnewhorizons.com/repository/releases/' }}
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Determine JDK versions
        id: list-jdk-versions
        shell: bash
        run: |
          (
            echo 'java-versions<<EOF'
            echo 8
            echo 17
            echo 21
            if [[ -f gradle/gradle-daemon-jvm.properties ]]; then
              yq -pprops -oprops '.toolchainVersion' gradle/gradle-daemon-jvm.properties
            fi
            echo EOF
          ) | tee -a "${GITHUB_OUTPUT}"

      - name: Set up JDK versions
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.list-jdk-versions.outputs.java-versions }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup the workspace
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' setupCIWorkspace

      - name: Build the mod
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' assemble

      # Continue on error in the following steps to make sure releases still get made even if one of the methods fails

      - name: Delete old release if it already exists
        run: gh release delete --yes "${RELEASE_VERSION}"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release under current tag
        run: |
          PRERELEASE_FLAG=""
          # DreamAssemblerXXL unfortunately breaks if prereleases are tagged as such on GitHub, so we only check for
          # $SNAPSHOT here.
          if [[ "$SNAPSHOT" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          CHANGELOG_OVERRIDE=".changelogs/${RELEASE_VERSION}.md"
          if [[ -f "$CHANGELOG_OVERRIDE" ]]; then
            echo "Using changelog override: $CHANGELOG_OVERRIDE"
            export "CHANGELOG_FILE=$CHANGELOG_OVERRIDE"
            echo "CHANGELOG_FILE=${CHANGELOG_FILE}" >> $GITHUB_ENV
          else
            echo "Generating changelog notes..."
            export "CHANGELOG_FILE=$(mktemp --suffix=.md)"
            echo "CHANGELOG_FILE=${CHANGELOG_FILE}" >> $GITHUB_ENV
            NATIVE_CHANGELOG_FILE="$(mktemp --suffix=.md)"
            UPSTREAM_ENTRIES_FILE="$(mktemp --suffix=.md)"
            PREVIOUS_TAG="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq "map(select(.draft == false and .tag_name != \"${RELEASE_VERSION}\"))[0].tag_name"
            )"

            USE_PREVIOUS_TAG=false
            if [[ -n "${PREVIOUS_TAG}" && "${PREVIOUS_TAG}" != "null" ]]; then
              if ! git rev-parse --verify "${PREVIOUS_TAG}^{commit}" > /dev/null 2>&1; then
                git fetch --no-tags --depth=1 origin \
                  "refs/tags/${PREVIOUS_TAG}:refs/tags/${PREVIOUS_TAG}" \
                  || echo "Previous tag could not be fetched; upstream entries will be skipped."
              fi

              if git merge-base --is-ancestor "${PREVIOUS_TAG}" "${RELEASE_VERSION}" 2> /dev/null; then
                USE_PREVIOUS_TAG=true
              else
                echo "Previous tag is outside the available history; using GitHub's default release notes."
              fi
            else
              echo "No previous release was found; using GitHub's default release notes."
            fi

            if [[ "${USE_PREVIOUS_TAG}" == "true" ]]; then
              gh api --method POST -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="${RELEASE_VERSION}" \
                -f previous_tag_name="${PREVIOUS_TAG}" \
                --jq ".body" > "${NATIVE_CHANGELOG_FILE}"

              python3 scripts/generate_upstream_notes.py \
                --upstream "${UPSTREAM_REPOSITORY}" \
                --previous-tag "${PREVIOUS_TAG}" \
                --current-tag "${RELEASE_VERSION}" \
                > "${UPSTREAM_ENTRIES_FILE}"
            else
              gh api --method POST -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="${RELEASE_VERSION}" \
                --jq ".body" > "${NATIVE_CHANGELOG_FILE}"
              : > "${UPSTREAM_ENTRIES_FILE}"
            fi

            python3 scripts/merge_release_notes.py \
              "${NATIVE_CHANGELOG_FILE}" "${UPSTREAM_ENTRIES_FILE}" \
              > "${CHANGELOG_FILE}"
          fi
          cat "${CHANGELOG_FILE}"
          gh release create "${RELEASE_VERSION}" -F "${CHANGELOG_FILE}" ${PRERELEASE_FLAG} ./build/libs/*.jar
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' assemble publish -x test
        continue-on-error: true
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        if: ${{ env.MAVEN_USER != '' }}

      - name: Publish to Modrinth
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' assemble publish -x test
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        if: ${{ env.SNAPSHOT != 'true' && env.PRERELEASE != 'true' }}

      - name: Publish to Curseforge
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' assemble publish -x test
        continue-on-error: true
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        if: ${{ env.SNAPSHOT != 'true' && env.PRERELEASE != 'true' }}
